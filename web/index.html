<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HID Tester · K3 Pro</title>
    <link rel="stylesheet" href="./css/bench.css" />
  </head>
  <body>
    <main class="scope">
      <header class="plate">
        <p class="brand">GESTÃO BEM · BANCADA</p>
        <h1>HID <span>K3P-H1</span></h1>
        <p class="logpath" id="log-path">/tmp/hid-tester.jsonl</p>
      </header>
      <section class="readout" aria-live="polite">
        <div>
          <span class="lbl">HEX</span>
          <code id="hex">—</code>
        </div>
        <div>
          <span class="lbl">SLOTS</span>
          <code id="slots">0/6</code>
        </div>
        <div>
          <span class="lbl">KEYS</span>
          <code id="keys">solto</code>
        </div>
        <div>
          <span class="lbl">STATUS</span>
          <code id="status">sonda</code>
        </div>
      </section>
      <section class="board" id="board"></section>
      <pre class="tail" id="tail"></pre>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
